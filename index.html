<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VidArt Mapper — Proiezione AR su palazzi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #050505;
      --surface: #121212;
      --surface2: #1c1c1e;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #e8ff3c;
      --accent2: #ff5e4a;
      --text: #f1f1f1;
      --muted: rgba(255, 255, 255, 0.45);
      --radius: 18px;
      --radius-sm: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Pro Text', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
      overflow: hidden;
      height: 100dvh;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    /* header */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 0.5px solid var(--border);
      z-index: 20;
    }
    #header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    #header span {
      font-size: 10px;
      color: var(--muted);
    }

    /* canvas + svg overlay */
    #canvas-wrap {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #main {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      pointer-events: auto;
      z-index: 15;
    }

    #hint-badge {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
      pointer-events: none;
      z-index: 25;
      border: 0.5px solid rgba(232,255,60,0.3);
      letter-spacing: 0.3px;
    }

    /* toolbar */
    #toolbar {
      flex-shrink: 0;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 44px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      cursor: pointer;
      flex: 1;
      transition: all 0.1s ease;
      min-height: 48px;
    }
    .btn:active { transform: scale(0.96); background: #2c2c2e; }
    .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn.reset-btn {
      border-color: rgba(255,94,74,0.5);
      color: #ff5e4a;
    }
    .btn.video-btn {
      background: rgba(232,255,60,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      padding: 6px 12px;
      border-radius: 44px;
    }
    .slider-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    input[type="range"] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      background: #3a3a3c;
      border-radius: 3px;
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      -webkit-appearance: none;
    }
    #points-count {
      font-size: 11px;
      font-weight: 500;
      background: #2a2a2c;
      padding: 4px 10px;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    /* configurator modal (video selector) */
    .config-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(24px);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px 20px 28px;
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border-top: 0.5px solid rgba(232,255,60,0.3);
    }
    .config-overlay.open {
      transform: translateY(0);
    }
    .config-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent);
    }
    .video-options {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .video-card {
      background: #1e1e22;
      border-radius: 20px;
      padding: 12px 18px;
      text-align: center;
      flex: 1;
      min-width: 90px;
      border: 0.5px solid var(--border);
      transition: all 0.1s;
      cursor: pointer;
    }
    .video-card:active { transform: scale(0.96); background: #2c2c30; }
    .video-card span:first-child {
      font-size: 28px;
      display: block;
      margin-bottom: 6px;
    }
    .video-card p {
      font-size: 12px;
      font-weight: 600;
    }
    .close-config {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 10px;
      border-radius: 40px;
      color: white;
      font-size: 12px;
      width: 100%;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>VIDART MAPPER</h1>
    <span>proiezione prospettica AR</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="main"></canvas>
    <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <polygon id="quad" fill="rgba(232,255,60,0.08)" stroke="rgba(232,255,60,0.65)"
               stroke-width="2" stroke-dasharray="7,5" points=""/>
      <g id="handles"></g>
    </svg>
    <div id="hint-badge">🎯 Tocca per posizionare i 4 angoli</div>
  </div>

  <div id="toolbar">
    <div class="btn-group">
      <button class="btn" id="btnSetMode">✧ PUNTI</button>
      <button class="btn" id="btnDragMode">⤢ TRASCINA</button>
      <button class="btn reset-btn" id="btnResetPoints">↺ RESET</button>
      <button class="btn video-btn" id="btnOpenConfig">🎬 VIDEO</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div class="slider-container">
        <span class="slider-label">OPACITÀ PROIEZIONE</span>
        <input type="range" id="opacitySlider" min="20" max="100" value="88">
        <span id="opacityValue" style="font-size:12px;">88%</span>
      </div>
      <div id="points-count">0 / 4 pt</div>
    </div>
  </div>
</div>

<!-- CONFIGURATORE VIDEO (3 demo videos) -->
<div id="videoConfigurator" class="config-overlay">
  <div class="config-title">🎬 SELEZIONA VIDEO PROIETTATO</div>
  <div class="video-options">
    <div class="video-card" data-video="0">
      <span>🌊</span>
      <p>FLUID DREAMS</p>
    </div>
    <div class="video-card" data-video="1">
      <span>🌀</span>
      <p>KINETIC WAVES</p>
    </div>
    <div class="video-card" data-video="2">
      <span>✨</span>
      <p>NEON SPECTRUM</p>
    </div>
  </div>
  <button class="close-config" id="closeConfigBtn">CHIUDI</button>
</div>

<script>
  // ----- DEMO VIDEO URLs (3 different, public, mobile friendly & loop) -----
  const DEMO_VIDEOS = [
    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4",
    "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
  ];
  const VIDEO_NAMES = ["Fluid Dreams", "Kine Waves", "Neon Spectrum"];

  // ----- GLOBALS -----
  const canvas = document.getElementById('main');
  const ctx = canvas.getContext('2d');
  const svgOverlay = document.getElementById('overlay-svg');
  const quadPolygon = document.getElementById('quad');
  const handlesGroup = document.getElementById('handles');
  const hintDiv = document.getElementById('hint-badge');
  const pointsSpan = document.getElementById('points-count');
  const opacitySlider = document.getElementById('opacitySlider');
  const opacityValueSpan = document.getElementById('opacityValue');

  let canvasW = 0, canvasH = 0;
  let points = [];            // max 4 {x, y} canvas coordinate
  let mode = "set";          // "set" o "drag"
  let activeProjectionVideo = null;   // HTMLVideoElement for projection
  let currentVideoIndex = -1;
  let cameraStream = null;
  let cameraVideo = null;     // live background element
  let cameraActive = false;
  let opacity = 0.88;
  let animationFrameId = null;
  let draggingIndex = null;
  let dragStartOffset = { x: 0, y: 0 };

  // UI buttons
  const btnSet = document.getElementById('btnSetMode');
  const btnDrag = document.getElementById('btnDragMode');
  const btnReset = document.getElementById('btnResetPoints');
  const btnOpenConfig = document.getElementById('btnOpenConfig');
  const configPanel = document.getElementById('videoConfigurator');
  const closeConfigBtn = document.getElementById('closeConfigBtn');

  // helper: update hint text & point counter
  function updateUIHints() {
    const hintsArr = [
      "📌 Tocca 1° angolo (superficie edificio)",
      "📍 2° angolo — segui il perimetro",
      "🔘 3° angolo — quasi finito",
      "✅ 4° angolo! Apri un video dalla tendina",
      "🎯 Trascina i punti per perfetta ancoraggio"
    ];
    if (points.length < 4) hintDiv.textContent = hintsArr[points.length] || "Posiziona 4 punti";
    else hintDiv.textContent = "✔️ Quadrilatero ancorato — scegli un video";
    pointsSpan.textContent = `${points.length} / 4 pt`;
  }

  // resize & scale points accordingly
  function resizeCanvasAndPoints() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const oldW = canvasW, oldH = canvasH;
    canvasW = rect.width;
    canvasH = rect.height;
    canvas.width = canvasW;
    canvas.height = canvasH;
    if (oldW > 0 && oldH > 0 && points.length > 0) {
      const sx = canvasW / oldW;
      const sy = canvasH / oldH;
      points = points.map(p => ({ x: p.x * sx, y: p.y * sy }));
    }
    updateSVGHandlesAndQuad();
    drawFrame();
  }

  // convert touch/mouse to canvas coords
  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const client = e.changedTouches ? e.changedTouches[0] : e;
    let x = (client.clientX - rect.left) * (canvasW / rect.width);
    let y = (client.clientY - rect.top) * (canvasH / rect.height);
    x = Math.min(Math.max(0, x), canvasW);
    y = Math.min(Math.max(0, y), canvasH);
    return { x, y };
  }

  // find nearest handle (threshold)
  function nearestHandle(pos, threshold = 32) {
    let bestIdx = -1, bestDist = threshold;
    points.forEach((p, idx) => {
      const d = Math.hypot(p.x - pos.x, p.y - pos.y);
      if (d < bestDist) {
        bestDist = d;
        bestIdx = idx;
      }
    });
    return bestIdx;
  }

  // Add point (only in set mode)
  function addPoint(pos) {
    if (mode !== "set") return false;
    if (points.length >= 4) return false;
    points.push({ x: pos.x, y: pos.y });
    updateSVGHandlesAndQuad();
    updateUIHints();
    drawFrame();
    if (points.length === 4) {
      // mostra il configuratore automaticamente quando i punti sono completi
      setTimeout(() => openConfigurator(), 150);
    }
    return true;
  }

  // reset points
  function resetPoints() {
    points = [];
    draggingIndex = null;
    updateSVGHandlesAndQuad();
    updateUIHints();
    setMode("set");
    drawFrame();
  }

  function setMode(newMode) {
    mode = newMode;
    btnSet.classList.toggle("active", mode === "set");
    btnDrag.classList.toggle("active", mode === "drag");
  }

  // SVG overlay update (quad + handles)
  function updateSVGHandlesAndQuad() {
    if (points.length >= 2) {
      const pointsStr = points.map(p => `${p.x},${p.y}`).join(' ');
      quadPolygon.setAttribute('points', pointsStr);
      quadPolygon.style.opacity = points.length === 4 ? "0.9" : "0.45";
    } else {
      quadPolygon.setAttribute('points', '');
    }
    // clear handles
    handlesGroup.innerHTML = '';
    const colors = ['#ff4d4d', '#4da6ff', '#6aff6a', '#ffcc33'];
    const labels = ['A', 'B', 'C', 'D'];
    points.forEach((p, i) => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'point-handle');
      // bigger touch area
      const bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bgCircle.setAttribute('cx', p.x);
      bgCircle.setAttribute('cy', p.y);
      bgCircle.setAttribute('r', '24');
      bgCircle.setAttribute('fill', colors[i]);
      bgCircle.setAttribute('fill-opacity', '0.18');
      bgCircle.setAttribute('stroke', 'none');
      
      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring.setAttribute('cx', p.x);
      ring.setAttribute('cy', p.y);
      ring.setAttribute('r', '14');
      ring.setAttribute('stroke', colors[i]);
      ring.setAttribute('stroke-width', '2.2');
      ring.setAttribute('fill', 'none');
      ring.setAttribute('filter', 'url(#glow)');
      
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', p.x);
      dot.setAttribute('cy', p.y);
      dot.setAttribute('r', '6');
      dot.setAttribute('fill', colors[i]);
      
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', p.x + 16);
      text.setAttribute('y', p.y - 12);
      text.setAttribute('fill', colors[i]);
      text.setAttribute('font-size', '12');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('font-family', 'monospace');
      text.textContent = labels[i];
      
      g.appendChild(bgCircle);
      g.appendChild(ring);
      g.appendChild(dot);
      g.appendChild(text);
      
      // drag events on handle
      g.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (mode === 'drag' || points.length === 4) {
          const pos = getCanvasCoords(e);
          const idx = nearestHandle(pos, 40);
          if (idx !== -1) {
            draggingIndex = idx;
            dragStartOffset = { x: pos.x - points[idx].x, y: pos.y - points[idx].y };
          }
        }
      }, { passive: false });
      g.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        if (mode === 'drag' || points.length === 4) {
          const pos = getCanvasCoords(e);
          const idx = nearestHandle(pos, 40);
          if (idx !== -1) {
            draggingIndex = idx;
            dragStartOffset = { x: pos.x - points[idx].x, y: pos.y - points[idx].y };
          }
        }
      });
      handlesGroup.appendChild(g);
    });
  }

  // global drag/move logic
  function handleDragMove(e) {
    if (draggingIndex === null) return;
    e.preventDefault();
    const pos = getCanvasCoords(e);
    let newX = Math.min(Math.max(0, pos.x - dragStartOffset.x), canvasW);
    let newY = Math.min(Math.max(0, pos.y - dragStartOffset.y), canvasH);
    points[draggingIndex] = { x: newX, y: newY };
    updateSVGHandlesAndQuad();
    drawFrame();
  }
  
  function stopDrag() { draggingIndex = null; }

  // Touch / mouse listeners
  svgOverlay.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const pos = getCanvasCoords(e);
    const near = nearestHandle(pos);
    if ((mode === 'drag' || points.length === 4) && near !== -1) {
      draggingIndex = near;
      dragStartOffset = { x: pos.x - points[near].x, y: pos.y - points[near].y };
    } else if (mode === 'set' && points.length < 4) {
      addPoint(pos);
    } else if (points.length === 4 && mode === 'set') {
      // se sono pieni, suggeriamo drag automaticamente
      setMode('drag');
      hintDiv.textContent = "🎯 Trascina i punti per allineare";
    }
  }, { passive: false });
  
  svgOverlay.addEventListener('mousedown', (e) => {
    const pos = getCanvasCoords(e);
    const near = nearestHandle(pos);
    if ((mode === 'drag' || points.length === 4) && near !== -1) {
      draggingIndex = near;
      dragStartOffset = { x: pos.x - points[near].x, y: pos.y - points[near].y };
      e.preventDefault();
    } else if (mode === 'set' && points.length < 4) {
      addPoint(pos);
    }
  });
  
  document.addEventListener('touchmove', (e) => {
    if (draggingIndex !== null) {
      e.preventDefault();
      handleDragMove(e);
    }
  }, { passive: false });
  document.addEventListener('mousemove', (e) => {
    if (draggingIndex !== null) handleDragMove(e);
  });
  document.addEventListener('touchend', stopDrag);
  document.addEventListener('mouseup', stopDrag);
  
  // ----- CAMERA LIVE (background) -----
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      cameraStream = stream;
      cameraVideo = document.createElement('video');
      cameraVideo.srcObject = stream;
      cameraVideo.muted = true;
      cameraVideo.playsInline = true;
      cameraVideo.autoplay = true;
      cameraVideo.setAttribute('playsinline', '');
      await cameraVideo.play();
      cameraActive = true;
      drawFrame();
    } catch (err) {
      console.warn("Camera error:", err);
      hintDiv.textContent = "⚠️ Permesso camera necessario per AR";
    }
  }
  
  // load selected projection video
  function loadProjectionVideo(index) {
    if (activeProjectionVideo) {
      activeProjectionVideo.pause();
      activeProjectionVideo.srcObject = null;
      activeProjectionVideo = null;
    }
    const videoUrl = DEMO_VIDEOS[index];
    const newVideo = document.createElement('video');
    newVideo.src = videoUrl;
    newVideo.loop = true;
    newVideo.muted = false;  // audio può essere piacevole, ma su mobile potrebbe servire interazione. in ogni caso l'utente ha cliccato
    newVideo.crossOrigin = 'anonymous';
    newVideo.playsInline = true;
    newVideo.setAttribute('playsinline', '');
    newVideo.addEventListener('loadeddata', () => {
      newVideo.play().catch(e => console.log("play failed", e));
    });
    newVideo.load();
    activeProjectionVideo = newVideo;
    currentVideoIndex = index;
    drawFrame();
  }
  
  // open configurator (video selector)
  function openConfigurator() {
    configPanel.classList.add('open');
  }
  function closeConfigurator() {
    configPanel.classList.remove('open');
  }
  
  // --- PERSPECTIVE DRAW (grid-based homography) ---
  function computeHomographyMatrix(srcPoints, dstPoints) {
    // srcPoints = 4 corners of video rect [[0,0],[w,0],[w,h],[0,h]]
    // dstPoints = canvas quadrilateral (points array)
    const A = [];
    for (let i = 0; i < 4; i++) {
      const [sx, sy] = srcPoints[i];
      const { x: dx, y: dy } = dstPoints[i];
      A.push([-sx, -sy, -1, 0, 0, 0, sx * dx, sy * dx, dx]);
      A.push([0, 0, 0, -sx, -sy, -1, sx * dy, sy * dy, dy]);
    }
    // Solve Ah = 0 using SVD-like (null space by power iteration)
    const n = 9;
    const ATA = Array(n).fill().map(() => Array(n).fill(0));
    for (let i = 0; i < A.length; i++) {
      for (let j = 0; j < n; j++) {
        for (let k = 0; k < n; k++) {
          ATA[j][k] += A[i][j] * A[i][k];
        }
      }
    }
    // find smallest eigenvector (power iteration on shifted matrix)
    let v = new Array(n).fill(0);
    v[8] = 1;
    let trace = 0;
    for (let i = 0; i < n; i++) trace += ATA[i][i];
    const lambdaMax = Math.abs(trace);
    const B = ATA.map((row, i) => row.map((val, j) => (i === j ? lambdaMax - val : -val)));
    for (let iter = 0; iter < 200; iter++) {
      const nv = new Array(n).fill(0);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          nv[i] += B[i][j] * v[j];
      let norm = Math.sqrt(nv.reduce((s, x) => s + x * x, 0));
      if (norm < 1e-12) break;
      v = nv.map(x => x / norm);
    }
    const H = [
      [v[0], v[1], v[2]],
      [v[3], v[4], v[5]],
      [v[6], v[7], v[8]]
    ];
    return H;
  }
  
  function applyHomography(H, x, y) {
    const w = H[2][0] * x + H[2][1] * y + H[2][2];
    if (Math.abs(w) < 1e-6) return { x: 0, y: 0 };
    return {
      x: (H[0][0] * x + H[0][1] * y + H[0][2]) / w,
      y: (H[1][0] * x + H[1][1] * y + H[1][2]) / w
    };
  }
  
  function drawPerspectiveProjection(videoElem, dstQuad, alpha) {
    if (!videoElem || videoElem.readyState < 2) return;
    const vidW = videoElem.videoWidth || 640;
    const vidH = videoElem.videoHeight || 360;
    if (vidW === 0 || vidH === 0) return;
    const srcCorners = [[0,0], [vidW,0], [vidW,vidH], [0,vidH]];
    const H = computeHomographyMatrix(srcCorners, dstQuad);
    if (!H) return;
    const STEPS = 36; // smooth mapping
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < STEPS; i++) {
      for (let j = 0; j < STEPS; j++) {
        const u0 = j / STEPS, u1 = (j+1)/STEPS;
        const v0 = i / STEPS, v1 = (i+1)/STEPS;
        const p0 = applyHomography(H, u0 * vidW, v0 * vidH);
        const p1 = applyHomography(H, u1 * vidW, v0 * vidH);
        const p2 = applyHomography(H, u1 * vidW, v1 * vidH);
        const p3 = applyHomography(H, u0 * vidW, v1 * vidH);
        // clipping test
        if (p0.x < -100 || p0.x > canvasW+100 || p1.x < -100) continue;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.clip();
        const patchW = (u1 - u0) * vidW;
        const patchH = (v1 - v0) * vidH;
        const dx1 = p1.x - p0.x, dy1 = p1.y - p0.y;
        const dx2 = p3.x - p0.x, dy2 = p3.y - p0.y;
        const angle = Math.atan2(dy1, dx1);
        const widthLen = Math.hypot(dx1, dy1);
        const heightLen = Math.hypot(dx2, dy2);
        ctx.translate(p0.x, p0.y);
        ctx.rotate(angle);
        const skewY = (dy2 / (patchH || 1)) * (patchH / (heightLen || 1));
        ctx.transform(1, 0, 0, skewY * (heightLen / (patchH || 1)), 0, 0);
        ctx.drawImage(videoElem, u0 * vidW, v0 * vidH, patchW, patchH, 0, 0, widthLen+1, heightLen+1);
        ctx.restore();
      }
    }
    ctx.restore();
  }
  
  // main draw: background (camera) + projection if points==4 and video exists
  function drawFrame() {
    if (!canvasW || !canvasH) return;
    ctx.clearRect(0, 0, canvasW, canvasH);
    // draw camera background
    if (cameraVideo && cameraVideo.readyState >= 2 && cameraVideo.videoWidth > 0) {
      const vw = cameraVideo.videoWidth, vh = cameraVideo.videoHeight;
      const scale = Math.max(canvasW / vw, canvasH / vh);
      const dw = vw * scale, dh = vh * scale;
      ctx.drawImage(cameraVideo, (canvasW - dw)/2, (canvasH - dh)/2, dw, dh);
    } else {
      ctx.fillStyle = "#0a0a1a";
      ctx.fillRect(0, 0, canvasW, canvasH);
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.font = "14px system-ui";
      ctx.fillText("📷 attivazione camera...", canvasW/2-80, canvasH/2);
    }
    // draw projection if quadrilateral is defined and video loaded
    if (points.length === 4 && activeProjectionVideo && activeProjectionVideo.readyState >= 2 && opacity > 0.02) {
      drawPerspectiveProjection(activeProjectionVideo, points, opacity);
    }
    // extra hint if video not selected but points are ready
    if (points.length === 4 && (!activeProjectionVideo || currentVideoIndex === -1)) {
      ctx.font = "bold 13px system-ui";
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#e8ff3c";
      ctx.shadowColor = "black";
      ctx.fillText("🎬 Premi VIDEO per proiettare opera", canvasW/2-140, canvasH-35);
    }
  }
  
  // animation loop (camera + video updates)
  function startRenderLoop() {
    function frameLoop() {
      drawFrame();
      requestAnimationFrame(frameLoop);
    }
    frameLoop();
  }
  
  // event listeners & startup
  function setupUI() {
    btnSet.addEventListener('click', () => setMode('set'));
    btnDrag.addEventListener('click', () => setMode('drag'));
    btnReset.addEventListener('click', resetPoints);
    btnOpenConfig.addEventListener('click', openConfigurator);
    closeConfigBtn.addEventListener('click', closeConfigurator);
    opacitySlider.addEventListener('input', (e) => {
      opacity = e.target.value / 100;
      opacityValueSpan.textContent = e.target.value + "%";
      drawFrame();
    });
    // configurator video cards
    document.querySelectorAll('.video-card').forEach((card, idx) => {
      card.addEventListener('click', () => {
        loadProjectionVideo(idx);
        closeConfigurator();
        hintDiv.textContent = `🎬 Riproducendo: ${VIDEO_NAMES[idx]} - allineamento attivo`;
        setTimeout(() => { if(points.length===4) hintDiv.textContent = "🎯 Trascina punti per rifinire"; }, 2000);
      });
    });
  }
  
  function onWindowResize() {
    resizeCanvasAndPoints();
  }
  
  async function bootstrap() {
    setupUI();
    window.addEventListener('resize', onWindowResize);
    await initCamera();
    resizeCanvasAndPoints();
    startRenderLoop();
  }
  
  bootstrap();
</script>
</body>
