<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Immerso Studio - Kino AR</title>

    <!-- Librerie Open Source: A-Frame e il nuovo motore 8th Wall XR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.6.0/aframe-master.min.js"></script>
    <script src="https://cdn.8thwall.org/web/xrextras/xrextras.js"></script>
    <script src="https://cdn.8thwall.org/web/aframe/8thwall-aframe.js"></script>

    <!-- Includiamo i componenti javascript del tuo progetto -->
    <script src="./src/components.js"></script>
  </head>

  <body>
    <!-- Setup della scena AR secondo gli standard 8th Wall open-source -->
    <a-scene
      xrweb
      xrextras-gesture-detector
      xrextras-loading
      xrextras-runtime-error>

      <a-assets>
        <!-- Qui dentro caricherai i tuoi modelli 3D in futuro -->
      </a-assets>

      <a-camera
        id="camera"
        position="0 8 8"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-entity
        light="type: directional; castShadow: true; intensity: 0.8;"
        position="1 4 3">
      </a-entity>

      <a-light type="ambient" intensity="0.7"></a-light>

      <!-- Il terreno interattivo che intercetta il tocco per posizionare gli oggetti -->
      <a-entity
        xrextras-named-named-surface
        xrextras-one-finger-rotate
        xrextras-two-finger-scale>
        
        <!-- Un cubo di test per verificare che l'AR funzioni senza l'errore AFRAME -->
        <a-box 
          position="0 0.5 0" 
          material="color: #00FFCC;" 
          shadow>
        </a-box>
      </a-entity>

    </a-scene>
  </body>
</html>
