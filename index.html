<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Alice nel Paese delle Meraviglie – AR Chess Pieces</title>
  
  <!-- 8th Wall (SOSTITUISCI XXXXXXXX CON LA TUA APP KEY VALIDA) -->
  <script async src="//apps.8thwall.com/xrweb?appKey=XXXXXXXX"></script>
  
  <!-- A-Frame + estensioni 8th Wall -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.8thwall.com/web/aframe/extras/8thwall-xr.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Avenir', 'Cursive', sans-serif; }
    .a-loader-title {
      font-size: 18px;
      color: #ffe6cc;
      text-shadow: 0 0 8px #cc66ff;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 40px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <a-scene
    background="color: #0a1a2a"
    xrextras-attach-shadow
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading-icon
    renderer="antialias: true"
    shadow="type: pcfsoft"
  >
    <!-- Telecamera con tracking AR -->
    <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false"></a-camera>

    <!-- Illuminazione per i modelli 3D -->
    <a-light type="ambient" color="#445566" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="2 5 3" shadow-map-size="1024"></a-light>
    <a-light type="directional" color="#ccaa88" intensity="0.5" position="-2 3 1"></a-light>

    <!-- Piano invisibile per ricevere i tocchi e l'hit testing (ancoraggio al pavimento) -->
    <a-plane
      id="hitplane"
      position="0 0 -2"
      rotation="-90 0 0"
      width="10" height="10"
      material="visible: false"
      xrextras-hit-test="target: #camera"
    ></a-plane>

    <!-- Componente personalizzato per spawnare le pedine al click -->
    <a-entity id="world-effects" world-effects></a-entity>
  </a-scene>

  <script>
    // Componente world-effects – esattamente come nell'esempio originale, ma con il modello delle pedine
    AFRAME.registerComponent('world-effects', {
      init: function() {
        this.spawnModel = this.spawnModel.bind(this);
        this.el.sceneEl.addEventListener('click', this.spawnModel);
      },

      spawnModel: function(event) {
        // Ottieni il punto di intersezione dal piano di hit test
        const intersection = event.detail.intersection;
        if (!intersection) return;

        // Crea l'entità della pedina
        const piece = document.createElement('a-entity');
        piece.setAttribute('gltf-model', 'assets/1.glb');
        piece.setAttribute('position', intersection.point);
        piece.setAttribute('shadow', 'receive: true; cast: true');
        
        // Scala e rotazione casuale per varietà
        piece.setAttribute('scale', '0.45 0.45 0.45');
        const randomYaw = Math.random() * 360;
        piece.setAttribute('rotation', `0 ${randomYaw} 0`);
        
        // Animazione di apparizione (simile all'esempio)
        piece.setAttribute('animation__appear', 'property: scale; from: 0 0 0; to: 0.45 0.45 0.45; dur: 300; easing: easeOutElastic');
        
        // Aggiungi alla scena
        this.el.sceneEl.appendChild(piece);
      }
    });
  </script>
</body>
</html>
