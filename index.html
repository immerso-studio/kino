<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Alice in Wonderland AR - Chess World</title>

    <script src="//cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
    <script src="//cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  </head>

  <body>
    <a-scene
      xrweb
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      shadow="type: pcfsoft">

      <a-assets>
        <a-asset-item id="chessModel" src="assets/1.glb"></a-asset-item>

        <template id="chess-template">
          <a-entity
            gltf-model="#chessModel"
            scale="1 1 1" 
            shadow="cast: true; receive: false"
            xrextras-hold-drag 
            xrextras-two-finger-rotate 
            xrextras-pinch-scale>
          </a-entity>
        </template>
      </a-assets>

      <a-camera
        id="camera"
        position="0 4 4"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-light type="ambient" color="#e8dbff" intensity="0.7"></a-light>
      
      <a-light 
        type="directional" 
        position="-2 5 2" 
        intensity="1.3" 
        cast-shadow="true"
        shadow-camera-top="10"
        shadow-camera-bottom="-10"
        shadow-camera-left="-10"
        shadow-camera-right="10">
      </a-light>

      <a-entity
        id="ground"
        class="cantap"
        geometry="primitive: box; width: 1000; height: 0.2; depth: 1000"
        material="color: #ffffff; transparent: true; opacity: 0.0"
        position="0 -0.1 0"
        xrextras-spawner="template: #chess-template">
      </a-entity>

    </a-scene>
  </body>
</html>
