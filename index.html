<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alice in Wonderland AR - Chess World</title>

    <script src="//cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
    <script src="//cdn.8thwall.com/web/xrextras/xrextras.js"></script>

    <script>
      window.onerror = function(msg, url, line) {
        const log = document.getElementById('debug-log');
        if (log) log.innerHTML += '<br><span style="color:#ff4d4d;">[ERRORE L:'+line+'] ' + msg + '</span>';
        return false;
      };
      console.warn = function(msg) {
        const log = document.getElementById('debug-log');
        if (log) log.innerHTML += '<br><span style="color:#ffad33;">[WARN] ' + msg + '</span>';
      };
    </script>
  </head>

  <body>
    <div id="debug-log" style="position: fixed; top: 0; left: 0; width: 100%; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.85); color: #00ff00; font-family: monospace; font-size: 11px; z-index: 999999; padding: 10px; pointer-events: none; box-sizing: border-box;">
      [Debug] Inizializzazione scena AR...
    </div>

    <a-scene
      xrweb
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      shadow="type: pcfsoft">

      <a-assets>
        <a-asset-item id="chessModel" src="assets/1.glb" timeout="10000"></a-asset-item>

        <template id="chess-template">
          <a-entity
            gltf-model="#chessModel"
            scale="1 1 1" 
            shadow="cast: true; receive: false"
            xrextras-hold-drag 
            xrextras-two-finger-rotate 
            xrextras-pinch-scale>
          </a-entity>
        </template>
      </a-assets>

      <a-camera
        id="camera"
        position="0 4 4"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-light type="ambient" color="#e2d4ff" intensity="0.8"></a-light>
      <a-light 
        type="directional" 
        position="-2 5 2" 
        intensity="1.2" 
        cast-shadow="true"
        shadow-camera-top="10"
        shadow-camera-bottom="-10"
        shadow-camera-left="-10"
        shadow-camera-right="10">
      </a-light>

      <a-entity
        id="ground"
        class="cantap"
        geometry="primitive: box; width: 1000; height: 0.2; depth: 1000"
        material="color: #ffffff; transparent: true; opacity: 0.0"
        position="0 -0.1 0"
        xrextras-spawner="template: #chess-template">
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('debug-log').innerHTML += '<br>[OK] DOM Caricato. In attesa della fotocamera...';
      });
    </script>
  </body>
</html>
