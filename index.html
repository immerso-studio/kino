<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Alice in Wonderland AR</title>

    <script async src="//apps.8thwall.com/xrweb?appKey=YOUR_APP_KEY_HERE"></script>

    <script src="//cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>

    <script src="//cdn.8thwall.com/web/xrextras/xrextras.js"></script>

    <script>
      AFRAME.registerComponent('tap-place', {
        init: function() {
          const ground = this.el
          ground.addEventListener('click', event => {
            // Crea una nuova entità per la pedina
            const newElement = document.createElement('a-entity')

            // Trova le coordinate del punto toccato
            const touchPoint = event.detail.intersection.point
            newElement.setAttribute('position', touchPoint)

            // Assegna il modello 3D (l'ID definito negli <a-assets>)
            newElement.setAttribute('gltf-model', '#chessModel')

            // ATTENZIONE: Modifica questi valori se la pedina è gigante o minuscola
            newElement.setAttribute('scale', '1 1 1')

            // Aggiungi ombre e permetti di trascinare/scalare l'oggetto
            newElement.setAttribute('shadow', 'receive: false; cast: true')
            newElement.setAttribute('class', 'cantap')
            newElement.setAttribute('xrextras-hold-drag', '')
            newElement.setAttribute('xrextras-two-finger-rotate', '')
            newElement.setAttribute('xrextras-pinch-scale', '')

            // Aggiungi l'oggetto alla scena
            this.el.sceneEl.appendChild(newElement)
          })
        }
      })
    </script>
  </head>

  <body>
    <a-scene
      xrweb
      xrextras-gesture-detector
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      light="defaultLightsEnabled: false">

      <a-assets>
        <a-asset-item id="chessModel" src="assets/1.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#d4c5f9" intensity="0.8"></a-light>
      <a-light type="directional"
               position="-0.5 3 1"
               intensity="1.5"
               cast-shadow="true"
               shadow-camera-top="5"
               shadow-camera-bottom="-5"
               shadow-camera-left="-5"
               shadow-camera-right="5">
      </a-light>

      <a-camera
        id="camera"
        position="0 4 4"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-entity
        id="ground"
        class="cantap"
        geometry="primitive: box; width: 1000; height: 0.2; depth: 1000"
        material="color: #ffffff; transparent: true; opacity: 0.0"
        position="0 -0.1 0"
        tap-place> </a-entity>

    </a-scene>
  </body>
</html>
