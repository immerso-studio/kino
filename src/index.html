<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>A-Frame: Tap to Place Ground</title>
  <meta itemprop="name" content="A-Frame: Tap to Place Ground">
  <meta name="twitter:title" content="A-Frame: Tap to Place Ground">
  <meta property="og:title" content="A-Frame: Tap to Place Ground">
  <meta property="og:site_name" content="A-Frame: Tap to Place Ground">
  <meta name="description" content="This example allows the user to grow cacti 🌵  by tapping or clicking the ground. Showcases raycasting, spawning objects, and importing a 3D model.">
  <meta itemprop="description" content="This example allows the user to grow cacti 🌵  by tapping or clicking the ground. Showcases raycasting, spawning objects, and importing a 3D model.">
  <meta property="og:description" content="This example allows the user to grow cacti 🌵  by tapping or clicking the ground. Showcases raycasting, spawning objects, and importing a 3D model.">
  <meta name="twitter:description" content="This example allows the user to grow cacti 🌵  by tapping or clicking the ground. Showcases raycasting, spawning objects, and importing a 3D model.">
  <meta property="og:image" content="https://8thwall.org/aframe-world-effects/assets/preview.gif"/>

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>
  
  <!-- Load Cinzel Font for the Start Screen -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<script src="bundle.js"></script>
<!-- Copyright (c) 2022 8th Wall, Inc. -->
<!-- body.html is optional; elements will be added to your html body after app.js is loaded. -->

<div class="over">
  <span id="promptText" style="display: none;">Tap To Place Model</span>
</div>

<!-- Custom Start Screen Overlay -->
<div id="startScreen" class="start-screen" style="display: none;">
  <div class="title-container">
    <div class="title-part word-1">THE</div>
    <div class="title-part word-2">LIVING</div>
    <div class="title-part word-3">CHESSBOARD</div>
  </div>
  <button id="startBtn" class="start-button">Inizia &raquo;</button>
  <div class="footer-container">
    <span class="footer-text">Un’esperienza in realtà aumentata realizzata da:</span>
    <img class="footer-logo" src="assets/logo-immerso.png" alt="Immerso Studio Logo">
  </div>
</div>


<!-- Add the tap-place component to the scene so it has an effect -->
<a-scene
  tap-place
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrweb="
    allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5; 
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;">

  <!-- We can define assets here to be loaded when A-Frame initializes -->
  <a-assets>
    <img id="groundTex" src="assets/sand.jpg">
    <a-asset-item id="model1" src="assets/1.glb"></a-asset-item>
    <a-asset-item id="model2" src="assets/2.glb"></a-asset-item>
    <a-asset-item id="model3" src="assets/3.glb"></a-asset-item>
    <a-asset-item id="model4" src="assets/4.glb"></a-asset-item>
    <a-asset-item id="model5" src="assets/5.glb"></a-asset-item>
    <a-asset-item id="model6" src="assets/6.glb"></a-asset-item>
    <a-asset-item id="model7" src="assets/7.glb"></a-asset-item>
    <a-asset-item id="model8" src="assets/8.glb"></a-asset-item>
    <a-asset-item id="model9" src="assets/9.glb"></a-asset-item>
    <a-asset-item id="model10" src="assets/10.glb"></a-asset-item>
    <a-asset-item id="model11" src="assets/11.glb"></a-asset-item>
    <a-asset-item id="model12" src="assets/12.glb"></a-asset-item>
  </a-assets>

  <!-- The raycaster will emit mouse events on scene objects specified with the cantap class -->
  <a-camera
    id="camera"
    position="0 8 8"
    raycaster="objects: .cantap"
    cursor="
      fuse: false;
      rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 40;
      shadowCameraBottom: -40;
      shadowCameraRight: 40;
      shadowCameraLeft: -40;
      target: #camera"
    xrextras-attach="target: camera; offset: 8 15 4"
    position="1 4.3 2.5"
    shadow>
  </a-entity>

  <a-light type="ambient" intensity="0.5"></a-light>

  <!-- Adding the cantap class allows the ground to be clicked -->
  <a-box
    id="ground"
    class="cantap"
    scale="1000 2 1000"
    position="0 -0.99 0"
    material="shader: shadow; transparent: true; opacity: 0.4"
    shadow>
  </a-box>
</a-scene>

</body>

</html>
